; PlatformIO project config for the Yertle quadruped (ESP32-S3-WROOM-1 N16R8)
; Docs: https://docs.platformio.org/page/projectconf.html

[env:yertle]
; Official Espressif platform. Pinned so a platform update can't silently break the build.
; It ships Arduino-ESP32 core 2.0.x. If you ever need core 3.x, switch to the pioarduino fork:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
; Arduino-ESP32 sits on top of ESP-IDF and its FreeRTOS, so xTaskCreatePinnedToCore,
; queues, mutexes etc. are all available from Arduino code.
framework = arduino

; --- N16R8 module: 16 MB flash + 8 MB *octal* PSRAM ---
; The stock board definition assumes 8 MB flash and no PSRAM, so override it.
; qio_opi = quad-SPI flash + octal-SPI PSRAM. Wrong value here = boot loop.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    ; Tell the core PSRAM exists so it initialises it (ps_malloc, etc.)
    -DBOARD_HAS_PSRAM
    ; We use the NATIVE USB port: route Serial to the S3's built-in USB-CDC,
    ; otherwise Serial goes to UART0 pins (43/44) and the monitor shows nothing.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Show log_e()/log_w() messages from the core (useful while bringing up hardware)
    -DCORE_DEBUG_LEVEL=2

monitor_speed = 115200
; Decodes Guru Meditation backtraces into file:line when the chip crashes
monitor_filters = esp32_exception_decoder
