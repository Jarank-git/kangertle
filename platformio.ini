; PlatformIO project config for Kangertle (ESP32-S3-WROOM-1 N16R8)
; Docs: https://docs.platformio.org/page/projectconf.html

[env:kangertle]
; Official Espressif platform, pinned so an update can't silently break the build.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
; Pure ESP-IDF (Espressif's official SDK), no Arduino layer.
; Chip-level settings (flash, PSRAM, USB console, FreeRTOS tick) live in sdkconfig.defaults,
; not here: that is ESP-IDF's own configuration system.
framework = espidf

; Tells the upload tool (esptool) about the 16 MB flash. Must agree with sdkconfig.defaults.
board_upload.flash_size = 16MB
board_build.flash_mode = qio

monitor_speed = 115200
; Decodes crash backtraces into file:line
monitor_filters = esp32_exception_decoder
